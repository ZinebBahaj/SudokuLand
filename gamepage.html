            @font-face{
                font-family: 'Gliker';
                src: url(gliker-regular-expanded/gliker-regular-expanded.ttf) format('truetype');
            }
            body {
                background-image:url("background.png");
                background-size:1530px 758px;
                background-repeat:no-repeat;
                background-attachment:scroll;
                background-color: #426f93;
                font-family: Arial, sans-serif;
                padding-top: 130px;
            }
            table{
                margin-top: 2.9%;
                margin-left: 3%;
                border: none;
                border-collapse: collapse;
                height: 90%;
                width: 50%;
            }
            table td{
                background-color: #F4F6F8;
                border: none;
                text-align: center;
                font-size: 20px;
                font-family: gliker,cursive;
                box-shadow: #0a1728 1px 1px 5px;
            }
            .tablediv{
                background: #ffffff;
                border: #D9DEE5 1px solid;
                box-shadow: rgba(0, 0, 0, 0.493) 1px 1px 15px;
                height:100%;
                width:58%;
                border-radius: 20px;
                display: flex;
                gap: 3%;
            }
            .tabledivcontainer{
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 10px;
                border-radius: 10px;
                height: 500px;
                width: 100%;
            }
            table td input{
                width: 100%;
                height: 100%;
                border: none;
                text-align: center;
                font-size: 20px;
                font-family:cursive;
                background-color: transparent;
            }
            table td:hover{
                background-color: #E1E5EA;
                box-shadow: #193c66 2px 2px 10px;
            }
            .logo{
                width:60%;
                height:auto;
                display: block; 
                margin: 0 auto;
            }
            .msgareacontainer{
                width: 40%;
                height: 90%;
                border-radius: 10px;
                border: #C9D1DB 1px solid;
                background-color: #F1F3F6;
                box-shadow: #193c66 1px 1px 5px;
                margin-top: 2.9%;
            }
            .msgarea{
                width: 90%;
                height: 60%;
                border-radius: 5px;
                border: none;
                background-color: rgb(255, 255, 255);
                box-shadow: #193c66 1px 1px 5px;
                margin: 0 auto;
            }
            button{

                height: 10%;
                border-radius: 5px;
                border: none;
                background-color: #D6E3F1;
                color:#193c66;
                box-shadow: #193c66 1px 1px 5px;
                font-size: 20px;
                font-family:cursive;
                display: block;
                margin: 0 auto;
                margin-top: 20px;
                padding: 10px;
            }
            button:hover{
                background-color: #193c66;
                color: #D6E3F1;
                box-shadow: #193c66 2px 2px 10px;
            }
            p{
                text-align: center;
                font-size: 20px;
                font-family: gliker,cursive;
                margin-top: 20px;
                color: #193c66;
            }
            .msgarea input{
                width: 100%;
                height: 100%;
                border: none;
                text-align: center;
                font-size: 20px;
                font-family:cursive;
                background-color: transparent;
