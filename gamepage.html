            body {

            table{
                margin-top: 2.9%;
                margin-left: 3%;
                border: none;
                border-collapse: collapse;
                height: 90%;
                width: 50%;
            }
            table td{
                background-color: #F4F6F8;
                border: none;
                text-align: center;
                font-size: 20px;
                font-family: gliker,cursive;
                box-shadow: #0a1728 1px 1px 5px;
            }
            .tablediv{
                background: #ffffff;
                border: #D9DEE5 1px solid;
                box-shadow: rgba(0, 0, 0, 0.493) 1px 1px 15px;
                height:100%;
                width:58%;
                border-radius: 20px;
                display: flex;
                gap: 3%;
            }
            .tabledivcontainer{
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 10px;
                border-radius: 10px;
                height: 500px;
                width: 100%;
            }
            table td input{
                width: 100%;
                height: 100%;
                border: none;
                text-align: center;
                font-size: 20px;
                font-family:cursive;
                background-color: transparent;
            }
            table td:hover{
                background-color: #E1E5EA;
                box-shadow: #193c66 2px 2px 10px;
            }
            .logo{
                width:60%;
                height:auto;
                display: block; 
                margin: 0 auto;
            }
            .msgareacontainer{
                width: 40%;
                height: 90%;
                border-radius: 10px;

                background-color: #F1F3F6;
                box-shadow: #193c66 1px 1px 5px;
                margin-top: 2.9%;
            }
            .msgarea{
                width: 90%;
                height: 60%;
                border-radius: 5px;
                border: none;
                background-color: rgb(255, 255, 255);
                box-shadow: #193c66 1px 1px 5px;
                margin: 0 auto;
            }
            button{
                width: 30%;
                height: 10%;
                border-radius: 5px;
                border: none;
                background-color: #D6E3F1;
                color:#193c66;
                box-shadow: #193c66 1px 1px 5px;
                font-size: 20px;
                font-family:cursive;
                display: block;
                margin: 0 auto;
                margin-top: 20px;
                padding: 10px;
                font-family: gliker;
                cursor: pointer;
            }
            button:hover{
                background-color: #193c66;
                color: #D6E3F1;
                box-shadow: #193c66 2px 2px 10px;
            }
            p{

                font-size: 20px;
                font-family: gliker,cursive;
                margin-top: 20px;
                color: #193c66;
            }
            .msgarea input{
                width: 100%;
                height: 100%;
                border: none;
                text-align: center;
                font-size: 20px;
                font-family:cursive;
                background-color: transparent;
            }
            .menubars{
                cursor: pointer;
                position: fixed;
                top: 5px;
                left: 20px;
                font-size: 32px;
                z-index: 1001;
            }
            .menubars:hover{
                text-shadow: 2px 2px 10px #0c1117;
            }
            .menulinks a:hover{
                background-color: #193c66a6;
                color: #D6E3F1;
                box-shadow: #193c66 2px 2px 10px;
                backdrop-filter: blur(10px);

            .sidebar{
                position: fixed;
                top: 0;
                left: -220px;
                height: 100%;
                width: 220px;
                background: rgba(66,110,147,0.75);

            function fituserguestname(){
                document.getElementById("username").style.fontSize = "32px";
